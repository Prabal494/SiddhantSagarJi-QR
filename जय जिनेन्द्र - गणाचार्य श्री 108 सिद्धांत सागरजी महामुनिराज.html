<meta name="description" content="जय जिनेन्द्र 🙏 गणाचार्य श्री 108 सिद्धांत सागरजी महामुनिराज">
<meta property="og:title" content="जय जिनेन्द्र 🙏 गणाचार्य श्री 108 सिद्धांत सागरजी महामुनिराज">
<meta property="og:description" content="प्रवचन, इंस्टाग्राम और WhatsApp से जुड़ें">

<title>जय जिनेन्द्र | गणाचार्य श्री 108 सिद्धांत सागरजी महामुनिराज</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{--bg1:#fff3dc;--bg2:#ffe2b8;--card:rgba(255,252,245,.82);--ink:#3a1d12;--muted:#7a5a48;--accent:#c2551a;--line:rgba(194,85,26,.22);--shadow:rgba(140,70,20,.18);--blob:.55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a130c;--bg2:#160a07;--card:rgba(52,30,20,.78);--ink:#fbeedb;--muted:#ccb094;--accent:#ffab5e;--line:rgba(255,171,94,.25);--shadow:rgba(0,0,0,.5);--blob:.32}}
:root[data-theme="dark"]{--bg1:#2a130c;--bg2:#160a07;--card:rgba(52,30,20,.78);--ink:#fbeedb;--muted:#ccb094;--accent:#ffab5e;--line:rgba(255,171,94,.25);--shadow:rgba(0,0,0,.5);--blob:.32}
*{box-sizing:border-box}
html{color-scheme:light dark;overflow-x:hidden}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans Devanagari',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden;position:relative}
.blob{position:fixed;width:56vmax;height:56vmax;border-radius:50%;filter:blur(70px);opacity:var(--blob);z-index:0;animation:drift 18s ease-in-out infinite alternate;pointer-events:none}
.b1{background:#f6a21e;top:-22vmax;left:-18vmax}
.b2{background:#d62828;bottom:-26vmax;right:-20vmax;animation-delay:-6s}
.b3{background:#2e9e4f;top:35%;left:55%;width:34vmax;height:34vmax;opacity:calc(var(--blob)*.55);animation-delay:-11s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.petal{position:absolute;bottom:-30px;opacity:0;animation:rise linear forwards}
@keyframes rise{10%{opacity:.8}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
main{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:6px 20px 40px;text-align:center}
.greet{font-family:'Tiro Devanagari Hindi',serif;font-size:1.1rem;color:var(--accent);letter-spacing:.5px;animation:fade .9s both}

.ribbon{position:relative;z-index:2;display:block;width:max(100vw,620px);max-width:none;height:auto;margin:0 0 0 50%;transform:translateX(-50%);filter:drop-shadow(0 4px 8px var(--shadow))}
.hero{position:relative;width:min(88vw,380px);margin:14px auto 6px;animation:pop .9s .15s both cubic-bezier(.2,1.4,.4,1)}
.halo{position:absolute;left:50%;top:2%;width:86%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:conic-gradient(#d62828,#f6c628,#fff,#2e9e4f,#1f5fbf,#d62828);filter:blur(34px);opacity:.55;animation:spinc 14s linear infinite}
.ring{position:absolute;left:50%;top:-1%;width:92%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;border:1px dashed var(--accent);opacity:.5;animation:spinc 30s linear infinite reverse}
@keyframes spinc{to{transform:translateX(-50%) rotate(360deg)}}
.hero img{position:relative;display:block;width:100%;height:auto;filter:drop-shadow(0 14px 18px var(--shadow));animation:float 6s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
h1{font-family:'Tiro Devanagari Hindi',serif;font-weight:400;font-size:1.75rem;line-height:1.3;margin:10px 0 10px;animation:fade .9s .3s both}
h1 small{display:block;font-size:1.05rem;color:var(--accent);margin-bottom:4px}
.sub{display:inline-block;margin:0;padding:4px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--accent);font-size:.9rem;animation:fade .9s .4s both}
.mantra{margin:20px auto 18px;max-width:340px;font-family:'Tiro Devanagari Hindi',serif;font-size:1.05rem;line-height:1.7;animation:fade .9s .5s both}
.mantra::before,.mantra::after{content:"❖";display:block;color:var(--accent);font-size:.8rem;opacity:.8}
.quote{margin:0 auto 24px;padding:16px 18px;max-width:380px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;animation:fade .9s .6s both}
.quote small{display:block;color:var(--accent);font-size:.78rem;margin-bottom:6px;letter-spacing:.5px}
.quote p{margin:0;font-family:'Tiro Devanagari Hindi',serif;font-size:1.12rem;line-height:1.6;transition:opacity .35s}
.quote button{margin-top:10px;background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;cursor:pointer}
.links{display:flex;flex-direction:column;gap:13px}
.links a{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;box-shadow:0 6px 16px var(--shadow);text-align:left;animation:fade .7s both;transition:transform .2s,box-shadow .2s}
.links a::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 4.5s infinite}
@keyframes shine{0%,60%{left:-70%}100%{left:130%}}
.links a:hover{transform:translateY(-3px);box-shadow:0 12px 24px var(--shadow)}
.links a:active{transform:scale(.98)}
.ic{width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.ic svg{width:24px;height:24px;fill:currentColor}
.t{flex:1;line-height:1.3}
.t b{display:block;font-weight:600;font-size:1.05rem}
.t span{font-size:.82rem;color:var(--muted)}
.arrow{color:var(--accent);font-size:1.4rem;transition:transform .2s}
.links a:hover .arrow{transform:translateX(4px)}
.share{margin-top:22px;padding:11px 24px;border-radius:99px;border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;animation:fade .9s 1.3s both}
footer{margin-top:26px;color:var(--muted);font-size:.9rem;font-family:'Tiro Devanagari Hindi',serif;animation:fade .9s 1.4s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;opacity:1!important}.petal{display:none}}
</style>
</head>
